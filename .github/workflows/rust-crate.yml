name: Rust crate

# Builds the gl-transitions crate (crates/gl-transitions) from the npm package build, tests it
# (naga validates every WGSL shader, Skia compiles every SkSL one on the CPU) and checks that it
# packages. ci.yml publishes it.

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "transitions/**"
      - "scripts/**"
      - "crates/**"
      - "packages/gl-transitions/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/rust-crate.yml"

permissions:
  contents: read

concurrency:
  group: rust-crate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  crate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/gl-transitions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # skia-safe's prebuilt Skia links them (tests/sksl.rs).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev libfontconfig1-dev

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --filter gl-transitions-repository --filter gl-transitions --no-optional

      # glslang (checksummed download) and naga (cargo build, ~1 min) for the shader targets.
      - name: Cache shader toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/gl-transitions-toolchain
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('scripts/targets/toolchain.mjs') }}

      # The crate's dev-dependencies: naga, and skia-safe with its prebuilt Skia binaries. Saved
      # per run and restored from the latest one, so the target folder stays warm.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            crates/gl-transitions/target
          key: rust-crate-${{ runner.os }}-${{ hashFiles('crates/gl-transitions/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            rust-crate-${{ runner.os }}-${{ hashFiles('crates/gl-transitions/Cargo.lock') }}-
            rust-crate-${{ runner.os }}-

      - name: Build the npm package and the crate's sources
        working-directory: .
        run: |
          pnpm run build
          pnpm run build:crate

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: |
          cargo test --locked
          cargo test --locked --no-default-features

      # The published crate must carry the generated sources although git ignores them. Cargo
      # counts these as uncommitted changes, hence --allow-dirty (nothing else is changed here).
      - name: Package
        run: |
          cargo package --locked --allow-dirty --list > "$RUNNER_TEMP/files.txt"
          grep -qx 'generated/catalog.rs' "$RUNNER_TEMP/files.txt"
          grep -q '^generated/sksl/' "$RUNNER_TEMP/files.txt"
          cargo publish --locked --allow-dirty --dry-run
