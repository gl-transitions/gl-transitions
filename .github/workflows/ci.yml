name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        # Without the Expo example, which only the React Native Skia e2e workflow builds.
        run: pnpm install --frozen-lockfile --filter '!gl-transitions-react-native-skia-example' --no-optional

      # glslang (checksummed download) and naga (cargo build, ~1 min) for the shader targets.
      - name: Cache shader toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/gl-transitions-toolchain
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('scripts/targets/toolchain.mjs') }}

      - name: Lint transitions
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

  check-publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if transitions or build changed
        id: check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found — will publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Only what ends up in the npm package (not tests, dev tooling or devDependencies).
          CHANGED=$(git diff --name-only "$LAST_TAG" -- \
            transitions/ skills/ packages/gl-transitions/ scripts/npm-package/ scripts/catalog/ scripts/targets/ scripts/agents/ \
            scripts/rendering/ package.json pnpm-workspace.yaml ':!*.test.mjs')
          if [ -n "$CHANGED" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Changed files affecting package:"
            echo "$CHANGED"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "No changes to transitions or build scripts — skipping publish"
          fi

  # Builds the package without publish rights: building runs native tools (glslang, naga
  # compiled by cargo, headless GL and Dawn to fill compatibility.json), so it stays out of
  # the job that holds the npm OIDC token. No cache here, so nothing written by other runs
  # ends up in the published package.
  package:
    needs: check-publish
    if: needs.check-publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build-catalog.mjs reads each transition's createdAt/updatedAt from git log.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglapi-mesa libosmesa6 mesa-vulkan-drivers

      # Optional gl (headless WebGL) and webgpu (Dawn) render the compatibility checks: their
      # install scripts are the only ones allowed (allowBuilds in pnpm-workspace.yaml).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod --filter gl-transitions-repository

      # Informational: without references, compatibility.json says the targets were only compiled.
      - name: Render references
        continue-on-error: true
        run: xvfb-run -s "-ac -screen 0 1280x1024x24" node scripts/rendering/render-references.mjs --out /tmp/refs

      - name: Build
        run: |
          if [ -d /tmp/refs ]; then export REFERENCE_RENDERS=/tmp/refs; fi
          pnpm run build

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: packages/gl-transitions/dist/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: dist

      # npm trusted publishing (OIDC, no token) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install --global --ignore-scripts npm@11

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: dist

      - name: Tag and push
        run: |
          VERSION=$(node -p "require('./dist/package.json').version")
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "Tag v${VERSION} already exists; skipping."
          else
            git tag "v${VERSION}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${VERSION}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
