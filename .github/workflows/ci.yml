name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Lint transitions
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  check-publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if transitions or build changed
        id: check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found — will publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Only what ends up in the npm package (not tests, dev tooling or devDependencies).
          CHANGED=$(git diff --name-only "$LAST_TAG" -- \
            transitions/ scripts/npm-package/ scripts/catalog/ scripts/targets/ ':!*.test.mjs')
          if [ -n "$CHANGED" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Changed files affecting package:"
            echo "$CHANGED"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "No changes to transitions or build scripts — skipping publish"
          fi

  publish:
    needs: check-publish
    if: needs.check-publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Runs with id-token (npm trusted publishing) and contents: write, so no dependency
      # install scripts here; gl (optional) and the dev tooling are not needed to build.
      - name: Install dependencies
        run: npm ci --omit=optional --omit=dev --ignore-scripts

      - name: Build
        run: npm run build

      # npm trusted publishing (OIDC, no token) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install --global --ignore-scripts npm@11

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: release

      - name: Tag and push
        run: |
          VERSION=$(node -p "require('./release/package.json').version")
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "Tag v${VERSION} already exists; skipping."
          else
            git tag "v${VERSION}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${VERSION}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
