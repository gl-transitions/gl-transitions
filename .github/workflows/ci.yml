name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Install dependencies
        # Without the examples: the e2e and Reference renders workflows build them. With the
        # optional dependencies: TypeScript 7's compiler is a native binary from an optional
        # platform package (this also installs gl and webgpu, which this job does not use).
        run: pnpm install --frozen-lockfile --filter '!gl-transitions-react-native-skia-example' --filter '!gl-transitions-remotion-example'

      # glslang (checksummed download) and naga (cargo build, ~1 min) for the shader targets.
      - name: Cache shader toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/gl-transitions-toolchain
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('scripts/targets/toolchain.mjs') }}

      - name: Lint transitions
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # Transitions need none: their changesets are written when the Version Packages PR is prepared.
      - name: Check changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/master'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/checks/check-changesets.mjs "$BASE_SHA"

  # Releases with changesets (https://changesets.dev/guide/automating): with pending changesets,
  # opens or updates the "Version Packages" pull request; once it is merged, packs and publishes
  # the new versions.
  release-mode:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter gl-transitions-repository --no-optional

      # One for each transition added or changed since the last release (not committed).
      - name: Write the changesets of the transitions
        run: node scripts/npm-package/write-transition-changesets.mjs

      - id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: release-mode
    if: needs.release-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter gl-transitions-repository --no-optional

      # One for each transition added or changed since the last release (not committed).
      - name: Write the changesets of the transitions
        run: node scripts/npm-package/write-transition-changesets.mjs

      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Also updates pnpm-lock.yaml, which records the peer ranges changesets bumps.
          script: pnpm run changeset:version
        env:
          # For the changelog's links to pull requests and authors (@changesets/changelog-github).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds and packs the new versions without publish rights: building runs native tools
  # (glslang, naga compiled by cargo, headless GL and Dawn to fill compatibility.json), so it
  # stays out of the job that holds the npm OIDC token. No cache here, so nothing written by
  # other runs ends up in the published packages.
  pack:
    needs: release-mode
    if: needs.release-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglapi-mesa libosmesa6 mesa-vulkan-drivers

      # Only gl (headless WebGL), webgpu (Dawn) and React Native Skia run install scripts
      # (allowBuilds in pnpm-workspace.yaml).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!gl-transitions-react-native-skia-example' --filter '!gl-transitions-remotion-example'

      # Informational: without references, compatibility.json says the targets were only compiled.
      - name: Render references
        continue-on-error: true
        run: xvfb-run -s "-ac -screen 0 1280x1024x24" node scripts/rendering/render-references.mjs --out /tmp/refs

      - name: Build
        run: |
          if [ -d /tmp/refs ]; then export REFERENCE_RENDERS=/tmp/refs; fi
          pnpm -r run build

      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.release-mode.outputs.publish-plan-artifact-id }}

  # Publishes the packed tarballs with npm trusted publishing (OIDC, no token; pnpm adds the
  # provenance), then tags each release and creates its GitHub release.
  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter gl-transitions-repository --no-optional

      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

  # The Rust crate, after npm, when its version is not on crates.io yet. Not only in publish mode:
  # a crate that failed to publish is retried on the next push to master.
  pack-crate:
    needs: [release-mode, pack, publish]
    if: ${{ !cancelled() && needs.release-mode.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
          install_args: node

      - name: Is the crate's version on crates.io?
        id: version
        run: |
          version=$(node scripts/rust-crate/sync-version.mjs --check)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'gl-transitions-release (https://github.com/gl-transitions/gl-transitions)' \
            "https://crates.io/api/v1/crates/gl-transitions/$version")
          case "$status" in
            200) echo "gl-transitions $version is on crates.io"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "gl-transitions $version is to publish"; echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered $status"; exit 1 ;;
          esac

      - name: Install Rust
        if: steps.version.outputs.publish == 'true'
        run: mise install --locked rust

      # From the published npm package (the sources of CATALOG_VERSION); npm may take a moment
      # to serve a version just published.
      - name: Build the crate's sources from the npm package
        if: steps.version.outputs.publish == 'true'
        run: |
          npm_version=$(node -p 'require("./packages/gl-transitions/package.json").version')
          mkdir -p "$RUNNER_TEMP/npm"
          for attempt in 1 2 3 4 5 6; do
            if npm pack "gl-transitions@$npm_version" --pack-destination "$RUNNER_TEMP/npm"; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 20
          done
          tar -xzf "$RUNNER_TEMP/npm/gl-transitions-$npm_version.tgz" -C "$RUNNER_TEMP/npm"
          node scripts/rust-crate/build-crate.mjs --package "$RUNNER_TEMP/npm/package"

      - name: Package
        if: steps.version.outputs.publish == 'true'
        working-directory: crates/gl-transitions
        run: |
          cargo package --locked --allow-dirty --list > "$RUNNER_TEMP/files.txt"
          grep -qx 'generated/catalog.rs' "$RUNNER_TEMP/files.txt"
          grep -q '^generated/sksl/' "$RUNNER_TEMP/files.txt"
          cargo package --locked --allow-dirty

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.publish == 'true'
        with:
          name: gl-transitions-crate
          path: |
            crates/gl-transitions
            !crates/gl-transitions/target
            !crates/gl-transitions/node_modules
          if-no-files-found: error
          retention-days: 30

  # crates.io trusted publishing (OIDC). --no-verify: pack-crate compiled it, nothing runs here.
  publish-crate:
    needs: pack-crate
    if: ${{ !cancelled() && needs.pack-crate.result == 'success' && needs.pack-crate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.pack-crate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
          install_args: rust

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gl-transitions-crate
          path: ${{ runner.temp }}/gl-transitions-crate

      # On a re-run.
      - name: Is the crate's version on crates.io?
        id: check
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'gl-transitions-release (https://github.com/gl-transitions/gl-transitions)' \
            "https://crates.io/api/v1/crates/gl-transitions/$VERSION")
          case "$status" in
            200) echo "gl-transitions $VERSION is already on crates.io"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered $status"; exit 1 ;;
          esac

      - id: auth
        if: steps.check.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}/gl-transitions-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          grep -q "^version = \"$VERSION\"" Cargo.toml
          cargo publish --locked --no-verify --allow-dirty
