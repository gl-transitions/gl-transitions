# Builds the example app (examples/react-native-skia) and runs its on-device checks on an
# Android emulator: every transition through <Transition> on the native Skia build, then
# the Reanimated path. Android because GitHub's Linux runners have KVM, so the emulator
# runs fast on the free runners (iOS needs macOS runners, slower to get and to build on).
name: React Native Skia e2e

on:
  pull_request:
    # What the package, the example and the gl-transitions package they use are built from.
    paths: &paths
      - "packages/gl-transitions/**"
      - "packages/react-native-skia/**"
      - "examples/react-native-skia/**"
      - "transitions/**"
      - "scripts/catalog/**"
      - "scripts/targets/**"
      - "scripts/npm-package/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/react-native-skia-e2e.yml"
  # On master, also fills the Gradle cache that pull requests restore.
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: examples/react-native-skia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # With the optional dependencies: pnpm records the optional peers of the example's copy of
      # the package (gl-transitions, Reanimated) as such.
      - name: Install the repository
        working-directory: .
        run: pnpm install --frozen-lockfile

      # glslang and naga, which the package build uses for the GLSL ES 3, WGSL and MSL targets.
      - name: Cache shader toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/gl-transitions-toolchain
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('scripts/targets/toolchain.mjs') }}

      # The example uses the package and gl-transitions (its dist/) built from this commit.
      - name: Build gl-transitions and the package
        working-directory: .
        run: |
          pnpm run build
          pnpm --filter @gl-transitions/react-native-skia run build

      # Metro only strips the types.
      - name: Type-check the example
        run: pnpm exec tsc --noEmit

      - name: Generate the Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # A release build: the JavaScript is bundled into the APK, as in a published app.
      # Only the emulator's ABI is built.
      - name: Build the APK
        working-directory: examples/react-native-skia/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner has no GPU: Skia draws through SwiftShader (swangle). Each line of
      # `script` runs in its own shell, hence the script file.
      - name: Run the checks on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swangle_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: examples/react-native-skia
          script: e2e/run-android.sh android/app/build/outputs/apk/release/app-release.apk /tmp/e2e

      - name: Summary
        if: always()
        run: |
          {
            echo "## React Native Skia e2e (Android emulator)"
            echo
            if [ -f /tmp/e2e/results.txt ]; then
              grep "^done:" /tmp/e2e/results.txt || echo "Did not finish, see logcat.txt in the artifact."
              grep "^FAIL" /tmp/e2e/results.txt | sed 's/^/- /' || true
            else
              echo "The checks did not run, see the logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: react-native-skia-e2e
          path: /tmp/e2e/
          if-no-files-found: ignore
