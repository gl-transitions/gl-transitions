name: Reference renders

# Renders every transition on the base branch and on the PR with the same
# software GL (Mesa llvmpipe) and reports transitions whose output changed.
# Then converts every transition to SkSL, renders it with Skia (CanvasKit) and
# reports how it compares with the GLSL render.
# Informational: fails only when a GLSL transition does not render.

on:
  pull_request:
    paths:
      - 'transitions/**'
      - 'scripts/preview/**'
      - 'scripts/lib/**'
      - 'tools/**'
      - '.github/workflows/references.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: references-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglapi-mesa libosmesa6

      - name: Install preview dependencies
        run: cd scripts/preview && npm install

      - name: Check out base transitions
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          mkdir -p /tmp/base
          git archive "origin/${BASE_REF}" transitions | tar -x -C /tmp/base

      - name: Render base and head
        run: |
          xvfb-run -s "-ac -screen 0 1280x1024x24" bash -c '
            node scripts/preview/render-references.js --transitions /tmp/base/transitions --out /tmp/refs/base > /tmp/refs-base.json &&
            node scripts/preview/render-references.js --out /tmp/refs/head > /tmp/refs-head.json;
            node scripts/preview/render-references.js --check --out /tmp/refs/base > /tmp/refs-diff.json
          '

      - name: Install tools dependencies
        run: cd tools && npm install

      - name: Build and compare SkSL
        run: node tools/build-sksl.js --out /tmp/sksl/shaders --refs /tmp/refs/head --renders /tmp/sksl/renders --report /tmp/sksl/report.json

      - name: Summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const read = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")); } catch { return null; } };
            const head = read("/tmp/refs-head.json"), diff = read("/tmp/refs-diff.json");
            const out = ["## Reference renders", ""];
            if (!head || !diff) { out.push("Rendering did not complete, see the logs."); }
            else {
              out.push(`Rendered ${head.rendered} transitions.`, "");
              out.push(`**Output changed:** ${diff.changed.length ? diff.changed.map(c => `\`${c.name}\` (progress ${c.progress.join(", ")})`).join(", ") : "none"}`);
              out.push(`**New:** ${diff.missing.length ? diff.missing.map(n => `\`${n}\``).join(", ") : "none"}`);
              if (head.failed.length) {
                out.push("", "**Failed to render:**");
                for (const f of head.failed) out.push(`- \`${f.name}\`: ${f.error.split("\n")[0]}`);
              }
            }
            const sksl = read("/tmp/sksl/report.json");
            if (sksl) {
              const order = ["match", "noise-only", "close", "differs", "no-reference", "compile-error", "unsupported"];
              out.push("", "## SkSL", "", "| Status | Count |", "|---|---|");
              for (const s of order) if (sksl.counts[s]) out.push(`| ${s} | ${sksl.counts[s]} |`);
              const notes = sksl.transitions.filter((t) => t.status !== "match");
              if (notes.length) {
                out.push("", "<details><summary>Transitions that do not match</summary>", "", "| Transition | Status | Differing pixels | Notes |", "|---|---|---|---|");
                for (const t of notes) {
                  const pct = t.differingPixels !== undefined ? `${(t.differingPixels * 100).toFixed(1)}%` : "";
                  const note = [t.hashNoise ? "hash noise" : "", (t.error || "").split("\n")[0].replace(/\|/g, "\\|")].filter(Boolean).join("; ");
                  out.push(`| \`${t.name}\` | ${t.status} | ${pct} | ${note} |`);
                }
                out.push("", "</details>");
              }
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-renders
          path: |
            /tmp/refs/
            /tmp/sksl/
          if-no-files-found: warn

      - name: Fail on render errors
        run: |
          node -e 'process.exit(JSON.parse(require("fs").readFileSync("/tmp/refs-head.json","utf8")).failed.length ? 1 : 0)'
