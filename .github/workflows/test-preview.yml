name: Test Preview

on:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/test-preview.yml'
  pull_request:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/test-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libglapi-mesa libosmesa6 ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod --filter gl-transitions-repository

      - name: Validate test transitions
        run: |
          xvfb-run -s "-ac -screen 0 1280x1024x24" bash -c '
            node scripts/checks/validate-transition.mjs -t transitions/fade.glsl &&
            node scripts/checks/validate-transition.mjs -t transitions/crosswarp.glsl &&
            node scripts/checks/validate-transition.mjs -t transitions/Bounce.glsl
          '

      - name: Render test transitions
        run: |
          mkdir -p /tmp/test-previews
          xvfb-run -s "-ac -screen 0 1280x1024x24" bash -c '
            node scripts/rendering/render-preview.mjs \
              --transition transitions/fade.glsl \
              --output /tmp/test-previews/fade.gif &&
            node scripts/rendering/render-preview.mjs \
              --transition transitions/crosswarp.glsl \
              --output /tmp/test-previews/crosswarp.gif &&
            node scripts/rendering/render-preview.mjs \
              --transition transitions/Bounce.glsl \
              --output /tmp/test-previews/Bounce.gif
          '

      - name: Verify GIFs
        run: |
          for gif in /tmp/test-previews/*.gif; do
            size=$(stat -c%s "$gif")
            echo "$(basename $gif): ${size} bytes"
            if [ "$size" -lt 1000 ]; then
              echo "ERROR: $gif is too small, likely broken"
              exit 1
            fi
          done

      - name: Upload test GIFs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-preview-gifs
          path: /tmp/test-previews/*.gif
